# RLT — SO101 bimanual + pi0.5
# hardware: configs/hardware/so101_dual_manifest.json
# rename:   configs/rename_maps/so101_dual.json
#
# action/state are both joint space (12D). Cameras: left_wrist, right_wrist, right_front.
# Defaults below prefer the RLT paper path; SO101 safety A/B flags are documented
# on the online CLI (--actor-residual-to-ref, --actor-fixed-std 0, clip-delta, …).

seed: 0
control_hz: 30
action_dim: 12
proprio_dim: 12
vla_horizon: 50
chunk_length: 10

cameras:
  - left_wrist
  - right_wrist
  - right_front

rl_token:
  token_dim: 2048
  nhead: 8
  enc_layers: 3
  dec_layers: 3
  ff_dim: 4096
  # Evo historical default was 4; prefer 1 for paper-comparable A/B, override if needed.
  num_rl_tokens: 1

demo_adaptation:
  steps: 10000
  batch_size: 2
  lr: 2.0e-4
  vla_ft_weight: 0.0
  grad_clip_norm: 1.0
  warmup_steps: 2000
  min_lr: 5.0e-6

actor:
  # Paper hard-task tier (screw-class): 3×512, absolute mu, fixed Gaussian std.
  hidden_dim: 512
  num_layers: 3
  fixed_std: 0.05
  residual_to_ref: false
  lr: 3.0e-4
  ref_dropout_p: 0.5

critic:
  hidden_dim: 512
  num_layers: 3
  lr: 3.0e-4

training:
  gamma: 0.999
  beta: 0.3
  tau: 0.005
  batch_size: 256
  utd_ratio: 5
  actor_update_interval: 2
  # Paper: no |mu-ref| clamp. Set e.g. 0.05 only for SO101 safety A/B.
  actor_action_clip_delta: null

replay:
  capacity: 200000

collector:
  warmup_steps: 5000
  total_env_steps: 100000
  chunk_subsample_stride: 2
